name: Build PC monitor firmware
on:
  workflow_dispatch:
  push:
    branches: [codex/pc-monitor]
    paths: ['platforms/esp32/main/pc_monitor.cpp', '.github/workflows/pc-monitor.yml', 'platforms/esp32/main/CMakeLists.txt']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build USB dashboard
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          export PC_MONITOR=1
          idf.py -C platforms/esp32 -DPC_MONITOR=ON set-target esp32s3
          idf.py -C platforms/esp32 -DPC_MONITOR=ON build
          mkdir -p firmware/bootloader firmware/partition_table
          cp platforms/esp32/build/bootloader/bootloader.bin firmware/bootloader/
          cp platforms/esp32/build/partition_table/partition-table.bin firmware/partition_table/
          cp platforms/esp32/build/moto_gps_esp32.bin firmware/
          cp platforms/esp32/build/flash_args platforms/esp32/build/flasher_args.json firmware/
          cp LICENSE.md NOTICE THIRD_PARTY_NOTICES.md firmware/
          cd firmware
          sha256sum bootloader/*.bin partition_table/*.bin *.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Monitor-Waveshare-1.75C
          path: firmware/
          retention-days: 30
